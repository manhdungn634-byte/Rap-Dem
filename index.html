<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rạp Đêm – Phim hay cả rổ</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--sf:#1c1f2a;--sf2:#2a2e3e;--tx:#f4f4f7;--mu:#9aa0b4;--ac:#ffd666;--ln:#3a3f52;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--ln);background:none;padding:.65rem 1.1rem;border-radius:99px}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#2a2005;border-color:var(--ac);font-weight:700}
input,select{background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:.75rem .9rem;width:100%}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(.7rem + env(safe-area-inset-top)) 1rem .7rem;background:rgba(13,15,20,.88);backdrop-filter:blur(14px)}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em}.logo b{color:var(--ac)}.logo small{display:block;font-size:.62rem;font-weight:500;color:var(--mu);letter-spacing:0}
#cfgB{width:44px;height:44px;padding:0;font-size:1.2rem;background:var(--sf)}
main{max-width:1000px;margin:auto}
.pills{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem 1rem;scrollbar-width:none}
.pills button{flex:none;padding:.6rem 1.2rem;font-weight:600}
.pills button.on,.chips button.on{background:linear-gradient(#ececf1,#b8bbc8);color:#15171f;border-color:transparent}
.hero{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:1rem 19%;scrollbar-width:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:2/3;border-radius:20px;overflow:hidden;border:2px solid #6b5a2a;background:var(--sf);cursor:pointer}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.hinfo{text-align:center;padding:.2rem 1rem 1rem;min-height:170px}
.hinfo h1{font-size:1.6rem;letter-spacing:-.02em}.hinfo p{color:var(--mu);font-size:1.05rem;margin:.2rem 0 .7rem}
.tags{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}.tags span{border:1.5px solid var(--tx);border-radius:12px;padding:.2rem .8rem;font-weight:600;font-size:.9rem}
.acts{display:flex;gap:.7rem;justify-content:center;margin-top:1rem}.acts button{flex:1;max-width:210px}
h2.t{font-size:1.35rem;padding:0 1rem;margin:1.4rem 0 .8rem}
.row{display:flex;gap:.8rem;overflow-x:auto;padding:0 1rem;scrollbar-width:none}
.row .card{flex:0 0 132px}
.tile{flex:0 0 160px;height:104px;border:0;border-radius:18px;text-align:left;font-weight:800;font-size:1.1rem;padding:1rem;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:0 1rem;margin:1.6rem 0 .8rem}
.sh h2{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}.sh button{width:40px;height:40px;padding:0;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem;padding:0 1rem}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.row .card{flex-basis:160px}}
.card{cursor:pointer;min-width:0}
.ph{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--sf2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph i{position:absolute;left:.4rem;font-style:normal;font-size:.72rem;font-weight:700;padding:.15rem .55rem;border-radius:99px}
.b1{top:.4rem;background:#3b82f6}.b2{bottom:.4rem;background:#1f9d55}
.ph u{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
.card p{margin-top:.45rem;font-size:.86rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mu);font-size:.75rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld{display:block;margin:1.4rem auto}
.sb{display:flex;gap:.6rem;padding:.8rem 1rem 0}.sb button{flex:none}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;padding:0 1rem;margin-bottom:1rem}.chips button{padding:.4rem .9rem;font-size:.88rem}
.msg{margin:1rem;background:var(--sf);border-radius:16px;padding:1.2rem;color:var(--mu);text-align:center;line-height:1.6}.msg code{color:var(--ac)}
.box{margin:1rem;display:flex;flex-direction:column;gap:.8rem}.box label{color:var(--mu);font-size:.85rem;display:flex;flex-direction:column;gap:.3rem}
.err{color:#ff7a8c;font-size:.85rem;min-height:1em}
.avl{width:96px;height:96px;border-radius:50%;margin:1rem auto 0;background:#ff6b81;color:#2a0b12;display:grid;place-items:center;font-size:2.4rem;font-weight:800;overflow:hidden}.avl img{width:100%;height:100%;object-fit:cover}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:.5rem;padding:.7rem .8rem calc(.6rem + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(13,15,20,.96) 45%);backdrop-filter:blur(8px)}
#tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem .2rem;font-size:.72rem;border-radius:22px;background:rgba(42,46,62,.75);color:var(--mu)}
#tabs span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tabs button.on{color:var(--ac);border-color:#8a7a45}
#tabs svg,.tav{width:24px;height:24px}#tabs svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tav{border-radius:50%;object-fit:cover}
dialog{border:0;border-radius:22px;background:var(--sf);color:var(--tx);padding:1.2rem;width:min(94vw,440px);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.75)}dialog.wide{width:100vw;max-width:980px;height:100dvh;max-height:100dvh;padding:0;border-radius:0;overflow:auto;background:#141519}
dialog label{display:block;margin:.8rem 0 .3rem;color:var(--mu);font-size:.85rem}
.row2{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.pw{position:sticky;top:0;z-index:5;aspect-ratio:16/9;background:#000;overflow:hidden}
.pw video,.pw iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.pw:fullscreen{aspect-ratio:auto;width:100%;height:100%}.pw:-webkit-full-screen{aspect-ratio:auto;width:100%;height:100%}
.ctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.15) 40%,rgba(0,0,0,.65));opacity:0;pointer-events:none;transition:opacity .2s;color:#fff}
.pw.show .ctl{opacity:1;pointer-events:auto}.pw.emb .ctl{display:none}
.ctl button,.cx{border:0;padding:.4rem;color:#fff;background:none;display:grid;place-items:center;border-radius:50%}
.ctl svg,.cx svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl svg.fl{fill:#fff;stroke:none}
.top{display:flex;justify-content:space-between;padding:.4rem .5rem}
.mid{display:flex;justify-content:space-evenly;align-items:center}.mid svg{width:36px;height:36px}.mid .big svg{width:54px;height:54px}.mid button:disabled{opacity:.35}
.bot{display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 .7rem .5rem;gap:0 .6rem;font-size:.85rem}
.bot #tm{grid-column:1}.bot #sk{grid-column:1;grid-row:2}.bot #fs{grid-column:2;grid-row:1/3}
#sk{-webkit-appearance:none;appearance:none;height:4px;border:0;padding:0;border-radius:2px;background:linear-gradient(to right,#f23b4e var(--p,0%),rgba(255,255,255,.35) var(--p,0%))}
#sk::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#f23b4e}
#sk::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#f23b4e}
.cx{position:absolute;top:.4rem;left:.4rem;background:rgba(0,0,0,.45);display:none}.pw.emb .cx{display:grid}
.mb{padding:.9rem 0 2rem}.mb h3{padding:0 1rem;font-size:1.2rem}.mb .og{padding:0 1rem;color:var(--mu);font-size:.9rem}
.lines{padding:.6rem 1rem 0;line-height:1.7;color:var(--mu);font-size:.92rem}.lines b{color:#cfd2de}
.desc{padding:.4rem 1rem 0;color:var(--mu);font-size:.88rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.desc.x{-webkit-line-clamp:unset}
.acts2{display:flex;gap:.7rem;padding:.9rem 1rem 0}.acts2 button{flex:1}
.mt{display:flex;gap:1.5rem;padding:1rem 1rem 0;border-bottom:1px solid #2a2c35}.mt button{border:0;border-radius:0;padding:.6rem 0;font-weight:800;font-size:1.15rem;color:#6c7080;border-bottom:3px solid transparent}.mt button.on{color:#fff;border-bottom-color:#f23b4e}
.sv{display:flex;gap:.4rem;flex-wrap:wrap;padding:.8rem 1rem 0}.sv button{padding:.35rem .8rem;font-size:.85rem}.sv button.on{background:var(--ac);color:#2a2005;border-color:var(--ac)}
.er{display:flex;gap:.9rem;padding:.7rem 1rem;cursor:pointer;align-items:flex-start}.er.on{background:#26282f}
.er .th{position:relative;flex:0 0 42%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--sf2)}.er .th img{width:100%;height:100%;object-fit:cover;display:block}
.er .th b{display:none;position:absolute;inset:0;background:rgba(0,0,0,.5);place-items:center;font-size:.8rem;font-weight:500}.er.on .th b{display:grid}
.er h4{font-weight:500;font-size:.95rem;line-height:1.35}.er small{color:var(--mu);display:block;margin-top:.5rem}
.g3{grid-template-columns:repeat(3,1fr);margin-top:1rem}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--ac);color:#2a2005;padding:.6rem 1.1rem;border-radius:99px;font-weight:700;display:none;z-index:99}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="logo">Rạp<b>Đêm</b><small>Phim hay cả rổ</small></div><button id="cfgB" aria-label="Cấu hình API">⚙</button></header>
<main id="app"></main>
<nav id="tabs"></nav>

<dialog id="dApi"><h3>Nguồn dữ liệu (API)</h3>
  <div class="chips" style="padding:0;margin:.8rem 0 0"><button data-pre="https://ophim1.com|https://img.ophim.live/uploads/movies/|oph">OPhim</button><button data-pre="https://phimapi.com|https://phimimg.com/|oph">KKPhim</button><button data-pre="https://phim.nguonc.com||nguonc">NguonC</button><button data-pre="||oph">Khác</button></div>
  <label for="apiIn">Địa chỉ API gốc</label><input id="apiIn">
  <label for="fmtIn">Định dạng API</label><select id="fmtIn"><option value="oph">OPhim / KKPhim và các site cùng kiểu</option><option value="nguonc">NguonC</option></select>
  <label for="imgIn">Địa chỉ ảnh (để trống nếu API tự trả về)</label><input id="imgIn">
  <div class="row2"><button class="pri" id="apiSave">Lưu và tải lại</button><button data-close>Đóng</button></div></dialog>
<dialog id="dGen"><h3>Thể loại</h3><div class="chips" id="gl2" style="padding:0;margin-top:1rem"></div><div class="row2"><button data-close>Đóng</button></div></dialog>
<dialog id="dMov" class="wide"><div id="mov"></div></dialog>
<input type="file" id="imp" accept=".json" hidden>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const S={view:'home',sub:'de-xuat',f:'new',lib:'history',kw:'',cdn:'',cfg:LS.get('cfg',{api:'https://ophim1.com',img:'https://img.ophim.live/uploads/movies/',fmt:'oph'}),user:LS.get('session',null)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
const msg=t=>`<div class="msg">${t}</div>`;
const GR=['linear-gradient(135deg,#f4c430,#e8707a)','linear-gradient(135deg,#3fb8a8,#8fa0c8)','linear-gradient(135deg,#7a7fc0,#d86f86)','linear-gradient(135deg,#e07a4f,#a24d8a)','linear-gradient(135deg,#4f8fe0,#5ac8a0)','linear-gradient(135deg,#b05ae0,#e05a8f)'];
const SUBS=[['de-xuat','Đề xuất'],['phim-bo','Phim bộ'],['phim-le','Phim lẻ'],['hoat-hinh','Hoạt hình']],FIL=[['new','Tất cả'],['phim-bo','Phim bộ'],['phim-le','Phim lẻ'],['hoat-hinh','Hoạt hình']];
const IC={home:'<path d="M3 11l9-8 9 8v10H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',lib:'<path d="M5 3h14v18l-7-4-7 4z"/>',acc:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};

/* ---------- Tài khoản & dữ liệu ---------- */
const users=()=>LS.get('users',{});
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const data=()=>LS.get('data:'+(S.user||'guest'),{history:[],fav:[]});
const save=d=>LS.set('data:'+(S.user||'guest'),d);
const isFav=s=>data().fav.some(f=>f.slug===s);
function toggleFav(m){const d=data(),i=d.fav.findIndex(f=>f.slug===m.slug);if(i>=0)d.fav.splice(i,1);else d.fav.unshift({slug:m.slug,name:m.name,origin_name:m.origin_name,year:m.year,thumb_url:img(m.thumb_url||m.poster_url)});save(d);return i<0}
function resize(file,size=96){return new Promise(res=>{if(!file)return res('');const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,size,size);res(c.toDataURL('image/jpeg',.8))};i.onerror=()=>res('');i.src=r.result};r.readAsDataURL(file)})}
let reg=false;
async function doAuth(){
  const u=$('#aU').value.trim().toLowerCase(),p=$('#aP').value,us=users(),E=$('#aE');
  if(u.length<3||p.length<4)return E.textContent='Tên tối thiểu 3 ký tự, mật khẩu tối thiểu 4 ký tự.';
  if(reg){if(us[u])return E.textContent='Tên đăng nhập đã được dùng.';us[u]={pw:await hash(p),avatar:await resize($('#aF').files[0])};LS.set('users',us)}
  else if(!us[u]||us[u].pw!==await hash(p))return E.textContent='Sai tên đăng nhập hoặc mật khẩu.';
  S.user=u;LS.set('session',u);toast('Xin chào '+u);render();
}
function exportData(){const blob=new Blob([JSON.stringify({v:1,user:S.user,...data()})],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=`rapdem-${S.user}.json`;l.click();toast('Đã tạo file sao lưu')}
$('#imp').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.history))throw 0;save({history:j.history,fav:j.fav||[]});toast('Đã khôi phục '+j.history.length+' mục lịch sử')}catch{toast('File sao lưu không hợp lệ')}e.target.value=''};

/* ---------- API ---------- */
async function api(path){const r=await fetch(S.cfg.api.replace(/\/$/,'')+path);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function norm(j){const d=j.data||j,p=d.params&&d.params.pagination,q=j.pagination;S.cdn=d.APP_DOMAIN_CDN_IMAGE||S.cdn;
  return{items:d.items||j.items||j.movies||[],pages:(p&&Math.ceil(p.totalItems/p.totalItemsPerPage))||(q&&q.totalPages)||null}}
function img(u){if(!u)return'';if(/^https?:/.test(u))return u;return(S.cfg.img||((S.cdn||S.cfg.api)+'/uploads/movies/')).replace(/\/?$/,'/')+u.replace(/^\//,'')}
/* NguonC: chuyển dữ liệu về cùng dạng với OPhim */
const NG_GEN=[['hanh-dong','Hành Động'],['tinh-cam','Tình Cảm'],['hai-huoc','Hài Hước'],['co-trang','Cổ Trang'],['tam-ly','Tâm Lý'],['hinh-su','Hình Sự'],['chien-tranh','Chiến Tranh'],['vo-thuat','Võ Thuật'],['vien-tuong','Viễn Tưởng'],['phieu-luu','Phiêu Lưu'],['khoa-hoc','Khoa Học'],['kinh-di','Kinh Dị'],['am-nhac','Âm Nhạc'],['than-thoai','Thần Thoại'],['gia-dinh','Gia Đình'],['chinh-kich','Chính Kịch'],['bi-an','Bí Ẩn'],['hoc-duong','Học Đường']].map(g=>({slug:g[0],name:g[1]}));
const NGP={new:'/api/films/phim-moi-cap-nhat','phim-bo':'/api/films/danh-sach/phim-bo','phim-le':'/api/films/danh-sach/phim-le','hoat-hinh':'/api/films/danh-sach/hoat-hinh'};
async function ngList(k,pg){
  const p=k.startsWith('g:')?`/api/films/the-loai/${k.slice(2)}?page=${pg}`:k.startsWith('q:')?`/api/films/search?keyword=${encodeURIComponent(k.slice(2))}&page=${pg}`:`${NGP[k]}?page=${pg}`;
  const j=await api(p);
  return{items:(j.items||[]).map(m=>({...m,origin_name:m.original_name,episode_current:m.current_episode,lang:m.language})),pages:(j.paginate&&j.paginate.total_page)||null};
}
async function ngDetail(slug){
  const m=(await api('/api/film/'+slug)).movie||{};
  const gp=n=>{const g=Object.values(m.category||{}).find(x=>x.group&&x.group.name===n);return g?g.list:[]};
  return{movie:{...m,origin_name:m.original_name,content:m.description,category:gp('Thể loại'),country:gp('Quốc gia'),director:m.director?String(m.director).split(','):[]},episodes:(m.episodes||[]).map(e=>({server_name:e.server_name,server_data:(e.items||[]).map(i=>({name:i.name,link_embed:i.embed,link_m3u8:i.m3u8}))}))};
}
async function getList(k,pg){
  if(S.cfg.fmt==='nguonc')return ngList(k,pg);
  if(k==='new'){try{const r=norm(await api(`/v1/api/danh-sach/phim-moi?page=${pg}`));if(r.items.length)return r;throw 0}catch{return norm(await api(`/danh-sach/phim-moi-cap-nhat?page=${pg}`))}}
  if(k.startsWith('g:'))return norm(await api(`/v1/api/the-loai/${k.slice(2)}?page=${pg}`));
  if(k.startsWith('q:'))return norm(await api(`/v1/api/tim-kiem?keyword=${encodeURIComponent(k.slice(2))}&page=${pg}`));
  return norm(await api(`/v1/api/danh-sach/${k}?page=${pg}`));
}
async function genres(){if(S.gen)return S.gen;if(S.cfg.fmt==='nguonc')return S.gen=NG_GEN;const j=await api('/v1/api/the-loai');return S.gen=(j.data&&j.data.items)||j.items||(Array.isArray(j)?j:[])}
const apiErr=e=>msg(`Không tải được dữ liệu từ <code>${esc(S.cfg.api)}</code> (${esc(e&&e.message||'lỗi')}).<br>Kiểm tra địa chỉ API ở nút ⚙, kết nối mạng, hoặc API có cho phép CORS hay không.`);

/* ---------- Giao diện ---------- */
const lg=s=>/thuyết/i.test(s)?'T.Minh':/vietsub/i.test(s)?'P.Đề':s;
const card=m=>`<div class="card" tabindex="0" data-slug="${esc(m.slug)}"><div class="ph"><img loading="lazy" src="${esc(img(m.thumb_url||m.poster_url))}" alt="">${m.lang?`<i class="b1">${esc(lg(m.lang))}</i>`:''}${m.episode_current?`<i class="b2">${esc(m.episode_current)}</i>`:''}${m._p?`<u style="width:${m._p}%"></u>`:''}</div><p>${esc(m.name)}</p><small>${esc(m.origin_name||'')}</small></div>`;
const pills=()=>`<div class="pills">${SUBS.map(([k,n])=>`<button data-act="sub" data-k="${k}" class="${S.view==='home'&&S.sub===k?'on':''}">${n}</button>`).join('')}<button data-act="gens" class="${S.view==='genre'?'on':''}">${S.view==='genre'?esc(S.gn):'Thể loại'} ▾</button></div>`;
function tabs(){const cur=S.view==='genre'?'home':S.view,av=S.user&&(users()[S.user]||{}).avatar;
  $('#tabs').innerHTML=[['home','Trang chủ'],['search','Tìm kiếm'],['lib','Thư viện'],['acc',S.user||'Tài khoản']].map(([v,n])=>`<button data-v="${v}" class="${cur===v?'on':''}">${v==='acc'&&av?`<img class="tav" src="${av}" alt="">`:`<svg viewBox="0 0 24 24">${IC[v]}</svg>`}<span>${esc(n)}</span></button>`).join('')}
async function listView(el,kind,title){
  S.pg=1;S.kind=kind;el.innerHTML=(title?`<h2 class="t">${title}</h2>`:'')+'<div class="grid" id="gl"></div><div id="more"></div>';await more()}
async function more(){const g=$('#gl'),m=$('#more');if(!g)return;
  try{const r=await getList(S.kind,S.pg);g.insertAdjacentHTML('beforeend',r.items.map(card).join(''));
    const end=!r.items.length||(r.pages&&S.pg>=r.pages);
    m.innerHTML=end?(g.children.length?'':msg('Không có phim phù hợp.')):'<button class="ld" data-act="more">Tải thêm</button>'}catch(e){m.innerHTML=apiErr(e)}}
function setHero(i){const m=S.hero[Math.min(Math.max(i,0),S.hero.length-1)],h=$('#hinfo');if(!h||h.dataset.s===m.slug)return;h.dataset.s=m.slug;h.dataset.i=S.hero.indexOf(m);
  h.innerHTML=`<h1>${esc(m.name)}</h1><p>${esc(m.origin_name||'')}</p><div class="tags">${[m.year,m.quality,m.episode_current,m.lang].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="acts"><button class="pri" data-slug="${esc(m.slug)}">▶ Xem ngay</button><button data-act="fav">${isFav(m.slug)?'♥ Đã lưu':'+ Danh sách'}</button></div>`}
async function homeBody(){
  const hc=$('#hc');if(S.sub!=='de-xuat')return listView(hc,S.sub,'');
  hc.innerHTML=msg('Đang tải…');
  const rs=await Promise.allSettled([getList('new',1),getList('phim-bo',1),getList('phim-le',1),getList('hoat-hinh',1),genres()]);
  if(rs[0].status==='rejected'&&rs[1].status==='rejected')return hc.innerHTML=apiErr(rs[0].reason);
  const L=i=>rs[i].status==='fulfilled'?rs[i].value.items:[],G=rs[4].status==='fulfilled'?rs[4].value.slice(0,8):[];
  S.hero=L(0).slice(0,8);
  hc.innerHTML=(S.hero.length?`<div class="hero" id="hero">${S.hero.map(m=>`<div class="slide" data-slug="${esc(m.slug)}"><img src="${esc(img(m.thumb_url||m.poster_url))}" alt="${esc(m.name)}"></div>`).join('')}</div><div id="hinfo" class="hinfo"></div>`:'')
   +(G.length?`<h2 class="t">Bạn đang quan tâm gì?</h2><div class="row">${G.map((g,i)=>`<button class="tile" style="background:${GR[i%6]}" data-act="genre" data-g="${esc(g.slug)}" data-n="${esc(g.name)}">${esc(g.name)}</button>`).join('')}</div>`:'')
   +[['Phim bộ mới','phim-bo','#ff8fc7',1],['Phim lẻ mới','phim-le','#ffc46b',2],['Hoạt hình','hoat-hinh','#8fe3ff',3]].map(([t,k,c,i])=>L(i).length?`<section><div class="sh"><h2 style="color:${c}">${t}</h2><button data-act="go" data-k="${k}" aria-label="Xem tất cả ${t}">›</button></div><div class="row">${L(i).map(card).join('')}</div></section>`:'').join('');
  if(S.hero.length){setHero(0);const h=$('#hero');h.onscroll=()=>setHero(Math.round(h.scrollLeft/(h.firstChild.offsetWidth+14)))}
}
function runSearch(){const q=$('#q'),kw=q?q.value.trim():'';S.kw=kw;listView($('#sr'),kw?'q:'+kw:S.f,'')}
function lib(){const d=data(),arr=S.lib==='history'?d.history:d.fav;
  $('#app').innerHTML=`<h2 class="t">Thư viện</h2><div class="chips">${[['history','Lịch sử xem'],['fav','Yêu thích']].map(([k,n])=>`<button data-act="libt" data-k="${k}" class="${S.lib===k?'on':''}">${n}</button>`).join('')}</div>`
   +(arr.length?`<div class="grid">${arr.map(m=>card({...m,lang:'',episode_current:m.ep||'',_p:m.dur?Math.min(100,m.t/m.dur*100):0})).join('')}</div>`:msg(S.user?'Chưa có phim nào ở đây.':'Bạn đang dùng chế độ khách. Đăng nhập ở mục Tài khoản để lưu riêng cho từng người.'))}
function acc(){const a=$('#app');
  if(!S.user){a.innerHTML=`<div class="box"><h2 class="t" style="padding:0">${reg?'Đăng ký':'Đăng nhập'}</h2><label>Tên đăng nhập<input id="aU" autocomplete="username"></label><label>Mật khẩu<input id="aP" type="password" autocomplete="current-password"></label>${reg?'<label>Ảnh đại diện (không bắt buộc)<input id="aF" type="file" accept="image/*"></label>':''}<div class="err" id="aE"></div><button class="pri" data-act="auth">${reg?'Tạo tài khoản':'Đăng nhập'}</button><button data-act="sw">${reg?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</button></div>`;return}
  const av=(users()[S.user]||{}).avatar;
  a.innerHTML=`<div class="box"><div class="avl">${av?`<img src="${av}" alt="">`:esc(S.user[0].toUpperCase())}</div><h2 class="t" style="padding:0;text-align:center;margin:0">${esc(S.user)}</h2><label>Đổi ảnh đại diện<input id="pF" type="file" accept="image/*"></label><button data-act="exp">Sao lưu (tải file)</button><button data-act="imp">Khôi phục từ file</button><button data-act="out">Đăng xuất</button></div>`;
  $('#pF').onchange=async e=>{const us=users();us[S.user].avatar=await resize(e.target.files[0]);LS.set('users',us);toast('Đã đổi ảnh');render()}}
async function render(){
  tabs();const a=$('#app'),v=S.view;
  if(v==='home'||v==='genre'){a.innerHTML=pills()+'<div id="hc"></div>';return v==='genre'?listView($('#hc'),'g:'+S.g,''):homeBody()}
  if(v==='search'){a.innerHTML=`<div class="sb"><input id="q" type="search" placeholder="Tìm phim, diễn viên…" aria-label="Tìm phim" value="${esc(S.kw)}"><button class="pri" data-act="find">Tìm</button></div><h2 class="t">Duyệt tìm</h2><div class="chips">${FIL.map(([k,n])=>`<button data-act="fil" data-k="${k}" class="${S.f===k?'on':''}">${n}</button>`).join('')}</div><div id="sr"></div>`;return runSearch()}
  if(v==='lib')return lib();acc();
}
const go=()=>{scrollTo(0,0);render()};
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act],[data-slug],[data-v],[data-pre]');if(!t)return;const d=t.dataset,a=d.act;
  if(d.pre!==undefined){const [x,y,f]=d.pre.split('|');$('#apiIn').value=x;$('#imgIn').value=y;$('#fmtIn').value=f||'oph';return}
  if(d.v){S.view=d.v;return go()}
  if(a==='sub'||a==='go'){S.view='home';S.sub=d.k;return go()}
  if(a==='genre'){S.view='genre';S.g=d.g;S.gn=d.n;$('#dGen').close();return go()}
  if(a==='gens'){const g=$('#gl2');g.innerHTML='Đang tải…';$('#dGen').showModal();try{g.innerHTML=(await genres()).map(x=>`<button data-act="genre" data-g="${esc(x.slug)}" data-n="${esc(x.name)}">${esc(x.name)}</button>`).join('')}catch(er){g.innerHTML=apiErr(er)}return}
  if(a==='more'){S.pg++;t.disabled=true;return more()}
  if(a==='find')return runSearch();
  if(a==='fil'){S.f=d.k;S.kw='';return render()}
  if(a==='libt'){S.lib=d.k;return lib()}
  if(a==='fav'){const h=$('#hinfo'),m=S.hero[+h.dataset.i];toast(toggleFav(m)?'Đã thêm vào danh sách':'Đã bỏ khỏi danh sách');h.dataset.s='';return setHero(+h.dataset.i)}
  if(a==='sw'){reg=!reg;return acc()}
  if(a==='auth')return doAuth();
  if(a==='exp')return exportData();
  if(a==='imp')return $('#imp').click();
  if(a==='out'){S.user=null;LS.set('session',null);return render()}
  if(d.slug&&!a)openMovie(d.slug);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.classList.contains('card'))e.target.click();if(e.target.id==='q')runSearch()}});

/* ---------- Xem phim ---------- */
let cur=null,hls=null,hideT;
const svg=(p,c='')=>`<svg viewBox="0 0 24 24" class="${c}">${p}</svg>`;
const T10=x=>`<text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff" stroke="none">10</text>`;
const I={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>',prev:'<path d="M6 5h2v14H6zM20 5v14L9 12z"/>',next:'<path d="M16 5h2v14h-2zM4 5v14l11-7z"/>',
 b10:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>'+T10(),f10:'<path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"/>'+T10(),
 fs:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',pip:'<rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="#fff"/>',cv:'<path d="M6 9l6 6 6-6"/>'};
const fmt=s=>{s=Math.floor(isFinite(s)?s:0);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const nm=v=>!v?'':typeof v==='string'?v:Array.isArray(v)?v.map(x=>(x&&x.name)||x).filter(Boolean).join(', '):'';
const shell=h=>`<div style="padding:1rem">${h}<div class="row2"><button data-x>Đóng</button></div></div>`;
function showCtl(){const pw=$('#pw'),v=$('#vd');if(!pw)return;pw.classList.add('show');clearTimeout(hideT);if(v&&!v.paused)hideT=setTimeout(()=>pw.classList.remove('show'),3000)}
async function openMovie(slug){
  const dlg=$('#dMov'),box=$('#mov');if(hls){hls.destroy();hls=null}
  box.innerHTML=shell(msg('Đang tải phim…'));if(!dlg.open)dlg.showModal();
  try{const j=S.cfg.fmt==='nguonc'?await ngDetail(slug):await api('/phim/'+slug),mv=j.movie||(j.data&&j.data.item)||{},eps=j.episodes||(j.data&&j.data.item&&j.data.item.episodes)||[];
    cur={slug,mv,eps,sv:0,ep:0,tab:'eps',resume:0,cat:((Array.isArray(mv.category)?mv.category:[])[0]||{}).slug};
    const s=data().history.find(h=>h.slug===slug);if(s){cur.sv=Math.min(s.sv||0,Math.max(eps.length-1,0));cur.ep=s.epi||0;cur.resume=s.t||0}
    drawPage();loadEp()}catch(e){box.innerHTML=shell(apiErr(e))}}
function drawPage(){
  const {mv}=cur;
  $('#mov').innerHTML=`<div class="pw show" id="pw"><video id="vd" playsinline></video><iframe id="ifr" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" hidden></iframe><button class="cx" data-x aria-label="Đóng">${svg(I.cv)}</button>
  <div class="ctl" id="ctl"><div class="top"><button data-x aria-label="Đóng">${svg(I.cv)}</button><button id="pip" aria-label="Hình trong hình">${svg(I.pip)}</button></div>
  <div class="mid"><button id="b10" aria-label="Lùi 10 giây">${svg(I.b10)}</button><button id="bp" aria-label="Tập trước">${svg(I.prev,'fl')}</button><button id="bpl" class="big" aria-label="Phát hoặc dừng">${svg(I.pause,'fl')}</button><button id="bn" aria-label="Tập sau">${svg(I.next,'fl')}</button><button id="f10" aria-label="Tua 10 giây">${svg(I.f10)}</button></div>
  <div class="bot"><span id="tm">00:00:00 / 00:00:00</span><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Thanh tua"><button id="fs" aria-label="Toàn màn hình">${svg(I.fs)}</button></div></div></div>
  <div class="mb"><h3>${esc(mv.name)}</h3><div class="og">${esc(mv.origin_name||'')} ${mv.year?'· '+esc(mv.year):''}</div>
  <p class="lines">${[['Đạo diễn',nm(mv.director)],['Quốc gia',nm(mv.country)],['Thể loại',nm(mv.category)]].filter(x=>x[1]).map(x=>`<b>${x[0]}:</b> ${esc(x[1])}`).join('<br>')}</p>
  <div class="desc">${esc((mv.content||'').replace(/<[^>]+>/g,''))}</div>
  <div class="acts2"><button id="favB">${isFav(cur.slug)?'♥ Đã lưu':'♡ Yêu thích'}</button><button id="shB">Chia sẻ</button></div>
  <div class="mt"><button data-tab="eps" class="on">CÁC TẬP</button>${cur.cat?'<button data-tab="sim">TƯƠNG TỰ</button>':''}</div><div id="tab">${epsHtml()}</div></div>`;
  bindPlayer();
}
function epsHtml(){const {eps,sv,mv}=cur,list=(eps[sv]&&eps[sv].server_data)||[],th=esc(img(mv.poster_url||mv.thumb_url));
  return(eps.length>1?`<div class="sv">${eps.map((s,i)=>`<button data-sv="${i}" class="${i===sv?'on':''}">${esc(s.server_name)}</button>`).join('')}</div>`:'')
  +(list.length?list.map((x,i)=>{const n=/^\d/.test(x.name)?'Tập '+x.name:x.name;return`<div class="er ${i===cur.ep?'on':''}" data-ep="${i}" role="button" tabindex="0"><div class="th"><img loading="lazy" src="${th}" alt=""><b>▶ Đang phát</b></div><div><h4>${esc(mv.name)} - ${esc(n)}</h4><small>${esc(n)}</small></div></div>`}).join(''):msg('Chưa có tập phim nào.'))}
async function renderTab(){const t=$('#tab');if(!t)return;document.querySelectorAll('.mt button').forEach(b=>b.classList.toggle('on',b.dataset.tab===cur.tab));
  if(cur.tab==='sim'){t.innerHTML=msg('Đang tải…');try{const r=await getList('g:'+cur.cat,1);t.innerHTML=`<div class="grid g3">${r.items.filter(m=>m.slug!==cur.slug).map(card).join('')}</div>`}catch(e){t.innerHTML=apiErr(e)}return}
  t.innerHTML=epsHtml()}
function step(d){const list=((cur.eps[cur.sv]||{}).server_data)||[],n=cur.ep+d;if(n<0||n>=list.length)return;cur.ep=n;cur.resume=0;loadEp()}
function loadEp(){
  const {eps,sv,ep}=cur,list=(eps[sv]&&eps[sv].server_data)||[],e=list[ep],pw=$('#pw'),v=$('#vd'),f=$('#ifr');
  if(hls){hls.destroy();hls=null}
  document.querySelectorAll('.er').forEach((r,i)=>r.classList.toggle('on',i===ep));
  $('#bp').disabled=ep<1;$('#bn').disabled=ep>=list.length-1;
  v.pause();v.removeAttribute('src');v.load();f.removeAttribute('src');f.removeAttribute('srcdoc');
  const url=e&&e.link_m3u8;
  if(url){pw.classList.remove('emb');f.hidden=true;v.hidden=false;
    const run=()=>{if(!v.canPlayType('application/vnd.apple.mpegurl')&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v)}else v.src=url;v.play().catch(()=>{})};
    if(v.canPlayType('application/vnd.apple.mpegurl')||window.Hls)run();else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js';s.onload=run;document.head.appendChild(s)}
  }else{pw.classList.add('emb');v.hidden=true;f.hidden=false;
    if(e&&e.link_embed)f.src=e.link_embed;else f.srcdoc='<body style="margin:0;background:#000;color:#aaa;font:14px sans-serif;display:grid;place-items:center;height:100vh">Chưa có video cho tập này.</body>'}
  showCtl();if(e)log(0,0)}
function bindPlayer(){
  const pw=$('#pw'),v=$('#vd'),sk=$('#sk');
  pw.addEventListener('pointermove',showCtl);
  pw.onclick=e=>{if(pw.classList.contains('emb')||e.target.closest('.ctl button,#sk'))return;pw.classList.contains('show')?pw.classList.remove('show'):showCtl()};
  $('#bpl').onclick=()=>{v.paused?v.play().catch(()=>{}):v.pause();showCtl()};
  $('#b10').onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10);showCtl()};
  $('#f10').onclick=()=>{v.currentTime=Math.min(v.duration||1e9,v.currentTime+10);showCtl()};
  $('#bp').onclick=()=>step(-1);$('#bn').onclick=()=>step(1);
  sk.oninput=()=>{if(v.duration)v.currentTime=sk.value/1000*v.duration;showCtl()};
  v.onplay=v.onpause=()=>{$('#bpl').innerHTML=svg(v.paused?I.play:I.pause,'fl');showCtl()};
  v.ontimeupdate=()=>{const d=v.duration||0;if(d){sk.value=v.currentTime/d*1000;sk.style.setProperty('--p',v.currentTime/d*100+'%')}$('#tm').textContent=fmt(v.currentTime)+' / '+fmt(d);if(!v._l||Date.now()-v._l>5000){v._l=Date.now();log(v.currentTime,d)}};
  v.onloadedmetadata=()=>{if(cur.resume>5&&cur.resume<v.duration-5)v.currentTime=cur.resume;cur.resume=0};
  v.onended=()=>step(1);
  $('#fs').onclick=toggleFs;$('#pip').onclick=togglePip}
function toggleFs(){const pw=$('#pw'),v=$('#vd');
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(pw.requestFullscreen){pw.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch{}}).catch(()=>{})}
  else if(pw.webkitRequestFullscreen)pw.webkitRequestFullscreen();
  else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();
  else toast('Trình duyệt không hỗ trợ toàn màn hình')}
async function togglePip(){const v=$('#vd');try{
  if(document.pictureInPictureElement){await document.exitPictureInPicture();return}
  if(v.requestPictureInPicture&&document.pictureInPictureEnabled)return await v.requestPictureInPicture();
  if(v.webkitSetPresentationMode)return v.webkitSetPresentationMode(v.webkitPresentationMode==='picture-in-picture'?'inline':'picture-in-picture');
  toast('Trình duyệt không hỗ trợ hình trong hình')}catch{toast('Không bật được hình trong hình')}}
function log(t,dur){const d=data(),{mv,slug,sv,ep,eps}=cur,n=((eps[sv]||{}).server_data||[])[ep]||{};
  d.history=d.history.filter(h=>h.slug!==slug);
  d.history.unshift({slug,name:mv.name,origin_name:mv.origin_name,year:mv.year,thumb_url:img(mv.thumb_url||mv.poster_url),sv,epi:ep,ep:n.name?'Tập '+String(n.name).replace(/^tập\s*/i,''):'',t,dur,at:Date.now()});
  d.history=d.history.slice(0,100);save(d)}
$('#mov').onclick=e=>{const b=e.target.closest('button,[data-ep]');
  if(e.target.closest('.desc'))e.target.closest('.desc').classList.toggle('x');
  if(!b)return;const d=b.dataset;
  if(d.x!==undefined)return $('#dMov').close();
  if(d.sv!==undefined){cur.sv=+d.sv;cur.ep=0;cur.resume=0;renderTab();return loadEp()}
  if(d.ep!==undefined){cur.ep=+d.ep;cur.resume=0;return loadEp()}
  if(d.tab){cur.tab=d.tab;return renderTab()}
  if(b.id==='favB'){toggleFav({...cur.mv,slug:cur.slug});b.textContent=isFav(cur.slug)?'♥ Đã lưu':'♡ Yêu thích'}
  if(b.id==='shB'){const u=location.href;if(navigator.share)navigator.share({title:cur.mv.name,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Đã chép liên kết'))}};
$('#dMov').addEventListener('close',()=>{if(hls){hls.destroy();hls=null}clearTimeout(hideT);$('#mov').innerHTML='';if(S.view==='lib')lib()});

/* ---------- Cấu hình ---------- */
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#cfgB').onclick=()=>{$('#apiIn').value=S.cfg.api;$('#imgIn').value=S.cfg.img;$('#fmtIn').value=S.cfg.fmt||'oph';$('#dApi').showModal()};
$('#apiSave').onclick=()=>{const a=$('#apiIn').value.trim();if(!/^https?:\/\//.test(a))return toast('API phải bắt đầu bằng http(s)://');S.cfg={api:a,img:$('#imgIn').value.trim(),fmt:$('#fmtIn').value};LS.set('cfg',S.cfg);S.cdn='';S.gen=null;$('#dApi').close();render()};
if(S.user&&!users()[S.user])S.user=null;
render();
</script>
</body>
</html>
